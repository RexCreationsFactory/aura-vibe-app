      const [weather, setWeather] = useState('Golden Hour');
      const [setting, setSetting] = useState('City Center');
      const [styleVibe, setStyleVibe] = useState('Elevated Casual');

      const [currentBlueprint, setCurrentBlueprint] = useState(VIBE_PRESETS['travel']);
      const [activePillar, setActivePillar] = useState(0);
      const [isSynthesizing, setIsSynthesizing] = useState(false);
      const [completedMissions, setCompletedMissions] = useState([0]);
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [activeTrackIndex, setActiveTrackIndex] = useState(0);
      const [poseGhostOpen, setPoseGhostOpen] = useState(false);
      const [activePoseIndex, setActivePoseIndex] = useState(0);
      const [showGrid, setShowGrid] = useState(true);
      const [flashEnabled, setFlashEnabled] = useState(false);
      const [shutterFlash, setShutterFlash] = useState(false);
      const [savedVault, setSavedVault] = useState([VIBE_PRESETS['blue-day']]);
      const [vaultOpen, setVaultOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const isDay = themeMode === 'day';

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2400);
      };

      const handlePickOccasion = (key) => {
        setSelectedOccasion(key);
        setCurrentBlueprint(VIBE_PRESETS[key]);
        if (key === 'blue-day') {
          setEnergyLevel(1);
          setSpendLevel(1);
          setWeather('Rainy & Cozy');
          setStyleVibe('Cozy Editorial');
        } else if (key === 'travel') {
          setEnergyLevel(4);
          setSpendLevel(3);
          setWeather('Golden Hour');
          setStyleVibe('Elevated Casual');
        } else if (key === 'linkup') {
          setEnergyLevel(3);
          setSpendLevel(2);
          setWeather('Soft Overcast');
          setStyleVibe('Street Minimal');
        } else if (key === 'night-out') {
          setEnergyLevel(5);
          setSpendLevel(4);
          setWeather('Crisp Night');
          setStyleVibe('Afterhours Edge');
        }
      };

      const handleLaunchBlueprint = (isRemix = false) => {
        setIsSynthesizing(true);
        setTimeout(() => {
          const base = VIBE_PRESETS[selectedOccasion] || VIBE_PRESETS['travel'];
          const energyNames = ['Couch-Adjacent', 'Gentle Drift', 'Balanced Flow', 'High Momentum', 'Full Send'];
          const spendNames = ['$0 Free', '$ Micro-Treat', '$$ Sweet Spot', '$$$ Treat Yourself'];

          setCurrentBlueprint({
            ...base,
            badge: `${weather.toUpperCase()} • ${setting.toUpperCase()}`,
            subtitle: `Tailored for ${energyNames[energyLevel - 1]} energy & ${spendNames[spendLevel - 1]} budget with ${styleVibe} styling.`,
            fit: {
              ...base.fit,
              formulaTitle: `${styleVibe} • ${weather}`
            }
          });
          setCompletedMissions([0]);
          setActivePillar(0);
          setIsSynthesizing(false);
          setStep(3);
          if (isRemix) triggerToast('✨ Vibe Remixed!');
        }, 650);
      };

      const toggleMission = (idx) => {
        setCompletedMissions((prev) =>
          prev.includes(idx) ? prev.filter((i) => i !== idx) : [...prev, idx]
        );
      };

      const handleCopyText = (text, label) => {
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
        triggerToast(`Copied ${label}: ${text}`);
      };

      const handleSaveToVault = () => {
        const exists = savedVault.some((v) => v.title === currentBlueprint.title);
        if (!exists) {
          setSavedVault([currentBlueprint, ...savedVault]);
          triggerToast('💖 Saved to your Vibe Vault');
        } else {
          triggerToast('Already in your Vault');
        }
      };

      const energyOptions = [
        { level: 1, emoji: '🛋️', label: 'Couch-Adjacent', sub: '15% Battery • Keep it super gentle' },
        { level: 2, emoji: '🌿', label: 'Low-Key Drift', sub: '35% Battery • Slow walk & warm drink' },
        { level: 3, emoji: '🌊', label: 'Balanced Flow', sub: '60% Battery • Ready to explore' },
        { level: 4, emoji: '✨', label: 'Main Character', sub: '85% Battery • High aesthetic energy' },
        { level: 5, emoji: '🔥', label: 'Full Send', sub: '100% Battery • Spontaneous adventure' }

        { level: 1, tag: '$0', label: 'Zero Spend', sub: 'Parks, architecture, window walk' },
        { level: 2, tag: '$', label: 'Micro-Treat', sub: 'Under $15 • Specialty coffee or pastry' },

                onClick={() => setThemeMode('day')}
                className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition-all cursor-pointer ${

                                ? 'bg-amber-500/15 border-amber-500/30 text-amber-900'
                                : 'bg-cyan-400/15 border-cyan-400/30 text-cyan-300'
                            }`}
                          >
                            <span className="truncate flex items-center gap-1.5">
                              <MapPin className="w-3.5 h-3.5 shrink-0" />
                              <span className="truncate">{currentBlueprint.move.searchQuery}</span>
                            </span>
                            <Copy className="w-3.5 h-3.5 shrink-0 ml-2" />
                          </button>
                        </div>
                      )}

                      {activePillar === 1 && (
                        <div className="space-y-3">
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-black uppercase tracking-wider text-rose-500">
                              02 // Outfit Formula
                            </span>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-500">
                              {currentBlueprint.fit.formulaTitle}
                            </span>
                          </div>

                          <div className="space-y-2">
                            {currentBlueprint.fit.items.map((item, idx) => (
                              <div
                                key={idx}
                                className={`p-2.5 rounded-2xl border flex items-center gap-3 ${
                                  isDay
                                    ? 'bg-white/80 border-slate-200/80'
                                    : 'bg-black/25 border-white/10'
                                }`}
                              >
                                <span className="text-xl">{item.icon}</span>
                                <div>
                                  <div className="text-[10px] font-extrabold uppercase opacity-60">
                                    {item.part}
                                  </div>
                                  <div className="text-xs font-bold leading-snug">{item.desc}</div>
                                </div>
                              </div>
                            ))}
                          </div>

                          <div className="space-y-1.5">
                            <span className="text-[10px] font-extrabold uppercase tracking-wider opacity-70">
                              Color Story (Tap to Copy Hex)
                            </span>
                            <div className="grid grid-cols-4 gap-2">
                              {currentBlueprint.fit.palette.map((sw, i) => (
                                <button
                                  key={i}
                                  onClick={() => handleCopyText(sw.hex, sw.name)}
                                  className="group text-center cursor-pointer"
                                >
                                  <div
                                    className="h-9 w-full rounded-xl border border-black/15 shadow-inner mb-1 group-hover:scale-105 transition-transform"
                                    style={{ backgroundColor: sw.hex }}
                                  />
                                  <div className="text-[10px] font-bold truncate">{sw.name}</div>
                                </button>
                              ))}
                            </div>
                          </div>

                          <div
                            className={`p-2.5 rounded-2xl text-[11px] leading-snug border ${
                              isDay
                                ? 'bg-amber-500/10 border-amber-500/30 text-amber-950'
                                : 'bg-amber-400/10 border-amber-400/30 text-amber-200'
                            }`}
                          >
                            <strong>💡 Lighting Tip:</strong> {currentBlueprint.fit.lightingTip}
                          </div>
                        </div>
                      )}

                      {activePillar === 2 && (
                        <div className="space-y-2.5">
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-black uppercase tracking-wider text-cyan-500">
                              03 // Poses & Angles
                            </span>
                            <button
                              onClick={() => setPoseGhostOpen(true)}
                              className="px-2.5 py-1 rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 text-[10px] font-black flex items-center gap-1 shadow cursor-pointer"
                            >
                              <Aperture className="w-3 h-3 animate-spin" />
                              <span>Open AR Ghost</span>
                            </button>
                          </div>

                          <div className="space-y-2">
                            {currentBlueprint.shot.poses.map((pose, idx) => {
                              const active = activePoseIndex === idx;
                              return (
                                <div
                                  key={idx}
                                  onClick={() => setActivePoseIndex(idx)}
                                  className={`p-2.5 rounded-2xl border transition-all cursor-pointer ${
                                    active
                                      ? isDay
                                        ? 'bg-sky-500/15 border-sky-500 border-2'
                                        : 'bg-cyan-400/15 border-cyan-400 border-2'
                                      : isDay
                                      ? 'bg-white/80 border-slate-200/80'
                                      : 'bg-black/25 border-white/10'
                                  }`}
                                >
                                  <div className="flex items-center justify-between">
                                    <span className="text-xs font-extrabold">
                                      0{idx + 1}. {pose.name}
                                    </span>
                                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-black/10 font-bold">
                                      {pose.lens}
                                    </span>
                                  </div>
                                  <p
                                    className={`text-[11px] mt-1 leading-snug ${
                                      isDay ? 'text-slate-600' : 'text-slate-300'
                                    }`}
                                  >
                                    {pose.instruction}
                                  </p>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}

                      {activePillar === 3 && (
                        <div className="space-y-3">
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-black uppercase tracking-wider text-purple-500">
                              04 // Sonic Frequency
                            </span>
                            <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full bg-purple-500/15 text-purple-400">
                              {currentBlueprint.frequency.bpm}
                            </span>
                          </div>

                          <div
                            className={`p-3 rounded-2xl border flex items-center justify-between ${
                              isDay
                                ? 'bg-gradient-to-r from-amber-500/15 to-rose-500/15 border-rose-300'
                                : 'bg-gradient-to-r from-fuchsia-500/20 to-cyan-500/20 border-white/15'
                            }`}
                          >
                            <div className="min-w-0 pr-2">
                              <div className="text-[10px] font-bold uppercase opacity-75">
                                {currentBlueprint.frequency.moodProfile}
                              </div>
                              <div className="text-xs font-black truncate">
                                {currentBlueprint.frequency.tracks[activeTrackIndex]?.title}
                              </div>
                              <div className="text-[10px] opacity-75 truncate">
                                {currentBlueprint.frequency.tracks[activeTrackIndex]?.artist}
                              </div>
                            </div>
                            <button
                              onClick={() => setIsPlayingAudio(!isPlayingAudio)}
                              className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 text-white flex items-center justify-center shadow-md shrink-0 cursor-pointer"
                            >
                              {isPlayingAudio ? (
                                <Pause className="w-4 h-4 fill-current" />
                              ) : (
                                <Play className="w-4 h-4 fill-current ml-0.5" />
                              )}
                            </button>
                          </div>

                          <div className="space-y-1.5">
                            {currentBlueprint.frequency.tracks.map((tr, idx) => (
                              <button
                                key={idx}
                                onClick={() => {
                                  setActiveTrackIndex(idx);
                                  setIsPlayingAudio(true);
                                }}
                                className={`w-full text-left p-2.5 rounded-2xl border flex items-center justify-between text-xs transition-all cursor-pointer ${
                                  activeTrackIndex === idx
                                    ? isDay
                                      ? 'bg-rose-500/15 border-rose-400 font-bold'
                                      : 'bg-fuchsia-400/20 border-fuchsia-400 font-bold'
                                    : isDay
                                    ? 'bg-white/80 border-slate-200/80'
                                    : 'bg-black/25 border-white/10'
                                }`}
                              >
                                <div className="truncate">
                                  <div className="text-xs font-bold truncate">{tr.title}</div>
                                  <div className="text-[10px] opacity-70 truncate">{tr.artist}</div>
                                </div>
                                <span className="text-[9px] px-2 py-0.5 rounded-full bg-black/10 font-bold shrink-0">
                                  {tr.tag}
                                </span>
                              </button>
                            ))}
                          </div>

                          <div className="text-[11px] italic opacity-80 pt-1">
                            🕯️ Sensory: {currentBlueprint.frequency.sensoryAnchor}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>

              {/* BOTTOM PHONE ACTION BAR */}
              <div className="relative z-20 px-5 pt-2 pb-5">
                {step < 2 && (
                  <button
                    onClick={() => setStep(step + 1)}
                    className={`w-full py-3.5 rounded-full font-extrabold text-sm shadow-xl flex items-center justify-center gap-2 transition-all hover:scale-[1.01] active:scale-95 cursor-pointer ${
                      isDay
                        ? 'bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 text-white shadow-rose-500/25'
                        : 'bg-gradient-to-r from-cyan-400 via-sky-400 to-fuchsia-400 text-slate-950 shadow-cyan-500/25'
                    }`}
                  >
                    <span>Continue</span>
                    <ChevronRight className="w-4 h-4 stroke-[3]" />
                  </button>
                )}

                {step === 2 && (
                  <button
                    onClick={() => handleLaunchBlueprint(false)}
                    disabled={isSynthesizing}
                    className={`w-full py-3.5 rounded-full font-extrabold text-sm shadow-xl flex items-center justify-center gap-2 transition-all hover:scale-[1.01] active:scale-95 cursor-pointer ${
                      isDay
                        ? 'bg-gradient-to-r from-amber-500 via-rose-500 to-purple-600 text-white shadow-rose-500/30'
                        : 'bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-amber-300 text-slate-950 shadow-fuchsia-500/30'
                    }`}
                  >
                    {isSynthesizing ? (
                      <>
                        <RefreshCw className="w-4 h-4 animate-spin" />
                        <span>Curating Your Vibe...</span>
                      </>
                    ) : (
                      <>
                        <Sparkles className="w-4 h-4" />
                        <span>Reveal My Vibe Blueprint</span>
                      </>
                    )}
                  </button>
                )}

                {step === 3 && (
                  <div className="flex items-center justify-between gap-2">
                    <button
                      onClick={() => setStep(0)}
                      className={`px-4 py-3 rounded-full text-xs font-extrabold backdrop-blur-xl border flex items-center gap-1.5 cursor-pointer ${
                        isDay
                          ? 'bg-white/75 border-white text-slate-800'
                          : 'bg-white/10 border-white/20 text-white'
                      }`}
                    >
                      <SlidersHorizontal className="w-3.5 h-3.5" />
                      <span>Retake Check</span>
                    </button>

                    <button
                      onClick={() => setActivePillar((activePillar + 1) % 4)}
                      className={`flex-1 py-3 px-4 rounded-full font-extrabold text-xs shadow-lg flex items-center justify-center gap-1.5 cursor-pointer ${
                        isDay
                          ? 'bg-slate-900 text-white'
                          : 'bg-gradient-to-r from-cyan-400 to-fuchsia-400 text-slate-950'
                      }`}
                    >
                      <span>Next Card ({activePillar + 1}/4)</span>
                      <ChevronRight className="w-4 h-4" />
                    </button>
                  </div>
                )}

                <div className="w-32 h-1 rounded-full bg-current/25 mx-auto mt-3" />
              </div>

              {/* AR POSE GHOST CAMERA VIEWFINDER */}
              {poseGhostOpen && (
                <div className="absolute inset-0 z-50 bg-slate-950/95 backdrop-blur-xl flex flex-col justify-between p-5 text-white">
                  <div className="pt-6 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping" />
                      <span className="text-[11px] font-mono font-bold text-cyan-400">
                        AR POSE GHOST
                      </span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <button
                        onClick={() => setShowGrid(!showGrid)}
                        className={`p-1.5 rounded-lg border ${
                          showGrid ? 'border-cyan-400 text-cyan-400' : 'border-white/20 text-white/50'
                        }`}
                      >
                        <Grid className="w-3.5 h-3.5" />
                      </button>
                      <button
                        onClick={() => setFlashEnabled(!flashEnabled)}
                        className={`p-1.5 rounded-lg border ${
                          flashEnabled
                            ? 'border-amber-400 text-amber-400'
                            : 'border-white/20 text-white/50'
                        }`}
                      >
                        <Zap className="w-3.5 h-3.5" />
                      </button>
                      <button
                        onClick={() => setPoseGhostOpen(false)}
                        className="p-1.5 rounded-lg bg-white/10 text-white"
                      >
                        <X className="w-4 h-4" />
                      </button>
                    </div>
                  </div>

                  <div className="relative flex-1 my-3 rounded-3xl bg-gradient-to-b from-slate-900 to-slate-950 border border-cyan-400/40 overflow-hidden flex items-center justify-center">
                    {shutterFlash && <div className="absolute inset-0 bg-white z-40" />}

                    {showGrid && (
                      <div className="absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none">
                        <div className="border-r border-b border-white/15" />
                        <div className="border-r border-b border-white/15" />
                        <div className="border-b border-white/15" />
                        <div className="border-r border-b border-white/15" />
                        <div className="border-r border-b border-white/15" />
                        <div className="border-b border-white/15" />
                        <div className="border-r border-white/15" />
                        <div className="border-r border-white/15" />
                        <div />
                      </div>
                    )}

                    <svg
                      viewBox="0 0 240 320"
                      className="w-56 h-72 drop-shadow-[0_0_12px_rgba(34,211,238,0.7)]"
                    >
                      <line
                        x1="20"
                        y1="210"
                        x2="220"
                        y2="210"
                        stroke="#f59e0b"
                        strokeWidth="1"
                        strokeDasharray="4 4"
                      />
                      <circle
                        cx="115"
                        cy="88"
                        r="22"
                        stroke="#22d3ee"
                        strokeWidth="2.5"
                        fill="rgba(34,211,238,0.1)"
                      />
                      <path
                        d="M72 142 Q115 124 158 142 L148 225 L82 225 Z"
                        stroke="#22d3ee"
                        strokeWidth="2.5"
                        fill="rgba(34,211,238,0.06)"
                      />
                      <path
                        d="M72 142 L54 185 L94 115"
                        stroke="#22d3ee"
                        strokeWidth="2.5"
                        fill="none"
                        strokeLinecap="round"
                      />
                      <path
                        d="M158 142 L174 185 L148 218"
                        stroke="#22d3ee"
                        strokeWidth="2.5"
                        fill="none"
                        strokeLinecap="round"
                      />
                      <circle cx="94" cy="115" r="4" fill="#f59e0b" />
                      <circle cx="148" cy="218" r="4" fill="#f59e0b" />
                    </svg>

                    <div className="absolute bottom-3 inset-x-3 p-3 rounded-2xl bg-black/75 backdrop-blur-md border border-white/15">
                      <div className="text-[11px] font-bold text-cyan-400">
                        {currentPose.name} • {currentPose.lens}
                      </div>
                      <p className="text-[11px] text-white/90 mt-0.5 leading-snug">
                        {currentPose.instruction}
                      </p>
                    </div>
                  </div>

                  <div className="space-y-3 pb-2">
                    <div className="grid grid-cols-3 gap-1.5">
                      {currentBlueprint.shot.poses.map((p, idx) => (
                        <button
                          key={idx}
                          onClick={() => setActivePoseIndex(idx)}
                          className={`py-1.5 rounded-xl text-[11px] font-bold border ${
                            activePoseIndex === idx
                              ? 'bg-cyan-400 text-slate-950 border-cyan-400'
                              : 'bg-white/5 border-white/15 text-white/70'
                          }`}
                        >
                          Pose 0{idx + 1}
                        </button>
                      ))}
                    </div>
                    <button
                      onClick={() => {
                        setShutterFlash(true);
                        setTimeout(() => setShutterFlash(false), 200);
                        triggerToast('📸 Pose reference snapped!');
                      }}
                      className="w-full py-3 rounded-full bg-gradient-to-r from-cyan-400 to-fuchsia-400 text-slate-950 font-black text-xs shadow-lg"
                    >
                      Snap Pose Reference
                    </button>
                  </div>
                </div>
              )}

              {/* SAVED VIBE VAULT */}
              {vaultOpen && (
                <div
                  className={`absolute inset-0 z-50 backdrop-blur-2xl p-5 flex flex-col justify-between ${
                    isDay ? 'bg-white/95 text-slate-900' : 'bg-slate-950/95 text-white'
                  }`}
                >
                  <div className="pt-6 space-y-4 overflow-y-auto">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <Bookmark className="w-5 h-5 text-rose-500" />
                        <h3 className="text-lg font-black">Saved Vibe Vault</h3>
                      </div>
                      <button
                        onClick={() => setVaultOpen(false)}
                        className="p-2 rounded-full bg-black/10"
                      >
                        <X className="w-4 h-4" />
                      </button>
                    </div>

                    <div className="space-y-2.5">
                      {savedVault.map((vibe, idx) => (
                        <div
                          key={idx}
                          onClick={() => {
                            setCurrentBlueprint(vibe);
                            setStep(3);
                            setVaultOpen(false);
                          }}
                          className={`p-3.5 rounded-3xl border cursor-pointer transition-all ${
                            isDay
                              ? 'bg-amber-50/80 border-amber-200 hover:bg-amber-100/70'
                              : 'bg-white/10 border-white/15 hover:bg-white/15'
                          }`}
                        >
                          <div className="flex items-center justify-between text-[10px] font-bold uppercase text-rose-500">
                            <span>
                              {vibe.emoji} {vibe.occasion}
                            </span>
                            <span>Tap to open →</span>
                          </div>
                          <div className="text-sm font-black mt-1">{vibe.title}</div>
                          <div className="flex items-center gap-1.5 mt-2">
                            {vibe.fit.palette.map((sw, i) => (
                              <span
                                key={i}
                                className="w-4 h-4 rounded-full border border-black/20"
                                style={{ backgroundColor: sw.hex }}
                              />
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <button
                    onClick={() => setVaultOpen(false)}
                    className="w-full py-3 rounded-full bg-slate-900 text-white text-xs font-extrabold"
                  >
                    Close Vault
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
